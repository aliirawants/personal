<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio & LinkedIn Branding — Ali Irawan</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{background:#FBFCFB}
.topnav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:14px 40px;background:rgba(251,252,251,.9);backdrop-filter:blur(14px);border-bottom:1px solid #EAEEEA}
.mod{border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:#fff;display:flex;flex-direction:column;gap:12px}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.55;color:var(--muted)}
@media (max-width:760px){.topnav{padding:14px 18px}}
</style>
</head>
<body>
<header class="topnav">
  <div style="display:flex;align-items:center;gap:14px">
    <a class="back" href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg> Beranda</a>
    <span style="display:flex;align-items:center;gap:10px" id="brand"></span>
  </div>
  <span class="pill b">Coming soon</span>
</header>
<main style="padding:36px 40px 56px;display:flex;flex-direction:column;gap:22px;max-width:1440px;margin:0 auto;width:100%">
  <section style="display:flex;flex-wrap:wrap;gap:36px;align-items:center">
    <div style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px">
      <h1 style="font-family:'Space Grotesk',Inter,sans-serif;font-size:40px;line-height:1.12;letter-spacing:-.03em;font-weight:700">Karya, pengalaman,<br>dan suara saya<br>di LinkedIn.</h1>
      <p style="margin:0;max-width:56ch;font-size:16px;line-height:1.65;color:var(--muted)">Bagian ini akan berdiri sebagai situs sendiri. Halaman ini jadi pintunya — begitu situsnya siap, tombol di bawah mengarah ke sana.</p>
      <span style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">
        <a class="btn" href="index.html" style="text-decoration:none">← Kembali ke beranda</a>
        <span class="btn" style="cursor:not-allowed;opacity:.55">Kunjungi situs portfolio</span>
      </span>
    </div>
    <div style="flex:1 1 300px;min-width:0;display:flex;justify-content:center" id="sketch"></div>
  </section>
  <section class="grid3" id="mods"></section>

</main>
<script src="icons.js"></script>
<script>
document.getElementById('brand').innerHTML = icon('ic-bank',30) + '<span style="font-family:\'Space Grotesk\',Inter,sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em">Portfolio &amp; LinkedIn Branding</span>';

document.getElementById('sketch').innerHTML =
 '<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto" role="img" aria-label="Sketsa tata letak halaman portofolio">' +
 '<rect x="10" y="10" width="280" height="180" rx="12" fill="#fff" stroke="#EAEEEA"/>' +
 '<rect x="26" y="28" width="90" height="10" rx="5" fill="#1D4ED8" opacity=".8"/>' +
 '<rect x="26" y="46" width="150" height="7" rx="3.5" fill="#E3E7E3"/>' +
 '<rect x="26" y="70" width="112" height="54" rx="8" fill="#DBEAFE"/>' +
 '<rect x="150" y="70" width="112" height="54" rx="8" fill="#DCFCE7"/>' +
 '<rect x="26" y="136" width="112" height="40" rx="8" fill="#FFEDD5"/>' +
 '<rect x="150" y="136" width="112" height="40" rx="8" fill="#F1F4F1"/></svg>';

var MODS = [
 ['ic-user','Profil & Ringkasan','Siapa kamu dalam satu layar: peran, fokus, dan cara kerja. Jadi bahan utama headline LinkedIn.',
  ['Headline dan ringkasan yang bisa dipakai ulang','Bidang keahlian dengan bukti, bukan klaim','Foto dan kontak profesional']],
 ['ic-bank','Pengalaman & Proyek','Kronologi kerja dan proyek yang benar-benar kamu pegang, lengkap dengan hasilnya.',
  ['Ringkasan per peran, bukan daftar tugas','Studi kasus: masalah, langkah, hasil terukur','Tautan ke materi yang boleh dibagikan']],
 ['ic-chart','Mesin LinkedIn Branding','Yang membedakan ini dari CV biasa: alat untuk menjaga kehadiranmu di LinkedIn tetap jalan.',
  ['Bank ide konten dan sudut pandang','Kalender posting dan draf','Catatan performa tiap posting','Template komentar dan outreach']]
];
document.getElementById('mods').innerHTML = MODS.map(function(m){
 return '<article class="mod">' + icon(m[0],46) +
  '<h2 style="font-family:\'Space Grotesk\',Inter,sans-serif;font-size:17px;font-weight:600;letter-spacing:-.01em">'+m[1]+'</h2>' +
  '<p style="margin:0;font-size:13px;line-height:1.6;color:var(--muted)">'+m[2]+'</p>' +
  '<ul class="bul">'+m[3].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></article>';
}).join('');

</script>
</body>
</html>
